name: Snow Shot Static Release

on:
  push:
    tags:
      - "v*_snow-shot"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snow-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and draft Snow Shot release
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.51
          vsversion: 18.0

      # Installed before the Qt and vcpkg builds so a missing packaging
      # dependency surfaces in a minute rather than three hours later.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }

      # snow-ocr-c embeds these models with include_bytes!, but they are
      # gitignored and fetched on demand, so the Rust build fails without
      # them. Cached because they come from a single upstream host.
      - name: Restore OCR model assets
        id: ocr-models
        uses: actions/cache/restore@v4
        with:
          path: snow-crates/crates/snow-ocr-c/assets/ppocrv6-small
          key: snow-ocr-models-${{ hashFiles('snow-crates/crates/snow-ocr-c/scripts/download_models.ps1') }}

      - name: Download OCR model assets
        if: steps.ocr-models.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\snow-crates\crates\snow-ocr-c\scripts\download_models.ps1

      - name: Save OCR model assets
        if: steps.ocr-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: snow-crates/crates/snow-ocr-c/assets/ppocrv6-small
          key: snow-ocr-models-${{ hashFiles('snow-crates/crates/snow-ocr-c/scripts/download_models.ps1') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Export GitHub Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            snow-crates -> ../build/snow-shot-msvc-release/cargo
            snow_draw_engine_qt -> ../build/snow-shot-msvc-release/cargo
          cache-on-failure: true

      - name: Restore static Qt kit
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static
          key: snow-qt-static-6.11.1-msvc2026-x64-${{ runner.os }}

      - name: Prepare Qt 6.11.1 static kit
        shell: pwsh
        env:
          PREINSTALLED_QT_STATIC_DIR: ${{ vars.SNOW_QT_STATIC_DIR }}
        run: |
          $prefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_64-static"
          $qtDir = $env:PREINSTALLED_QT_STATIC_DIR
          if ([string]::IsNullOrWhiteSpace($qtDir)) {
            & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -QtVersion 6.11.1 -InstallPrefix $prefix
            if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
            $qtDir = Join-Path $prefix "lib\cmake\Qt6"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt 6.11.1 static CMake package was not found at $qtDir"
          }
          "SNOW_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Saved here, not in a post step, so that a later failure in this job
      # does not discard a Qt kit that took hours to compile.
      - name: Save static Qt kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static
          key: snow-qt-static-6.11.1-msvc2026-x64-${{ runner.os }}

      - name: Install vcpkg and project dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Qt6Dir $env:SNOW_QT_STATIC_DIR -VcpkgVariants Static

      - name: Build, audit, and package statically
        shell: pwsh
        run: .\scripts\stage-snow-shot-release.ps1

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch '^v.+_snow-shot$') {
            throw "Unexpected release tag: $env:GITHUB_REF_NAME"
          }
          $packages = @(Get-ChildItem build\snow-shot-msvc-release -File |
            Where-Object { $_.Name -match '^snow-shot-.+\.exe$' -or $_.Name -match '^snow-shot-.+\.exe\.sha256$' })
          if ($packages.Count -lt 2) { throw "The package and SHA-256 checksum were not produced." }
          $assets = ($packages | ForEach-Object { $_.FullName }) -join "`n"
          "assets<<SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-x64
          path: ${{ steps.package.outputs.assets }}

      - name: Create draft prerelease with generated changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "${{ steps.package.outputs.assets }}" -split "`n" | Where-Object { $_ }
          gh release create $env:GITHUB_REF_NAME @assets `
            --draft `
            --prerelease `
            --generate-notes `
            --title "Snow Shot $env:GITHUB_REF_NAME"

  build-and-release-arm64:
    name: Build and draft Snow Shot release (ARM64)
    needs: build-and-release
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select MSVC ARM64 cross tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64
          toolset: 14.51
          vsversion: 18.0

      # makensis runs on the host, so the x64 build of NSIS also produces the
      # ARM64 installer. Installed early for the same reason as in the x64 job.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }

      # Same embedded OCR models as the x64 job; they are plain data, so one
      # download serves either target architecture.
      - name: Restore OCR model assets
        id: ocr-models
        uses: actions/cache/restore@v4
        with:
          path: snow-crates/crates/snow-ocr-c/assets/ppocrv6-small
          key: snow-ocr-models-${{ hashFiles('snow-crates/crates/snow-ocr-c/scripts/download_models.ps1') }}

      - name: Download OCR model assets
        if: steps.ocr-models.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\snow-crates\crates\snow-ocr-c\scripts\download_models.ps1

      - name: Save OCR model assets
        if: steps.ocr-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: snow-crates/crates/snow-ocr-c/assets/ppocrv6-small
          key: snow-ocr-models-${{ hashFiles('snow-crates/crates/snow-ocr-c/scripts/download_models.ps1') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: aarch64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Export GitHub Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            snow-crates -> ../build/snow-shot-msvc-release-arm64/cargo
            snow_draw_engine_qt -> ../build/snow-shot-msvc-release-arm64/cargo
          cache-on-failure: true

      - name: Restore static Qt kit (x64 host tools)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static
          key: snow-qt-static-6.11.1-msvc2026-x64-${{ runner.os }}

      - name: Restore static Qt kit (ARM64)
        id: qt-cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_arm64-static
          key: snow-qt-static-6.11.1-msvc2026-arm64-${{ runner.os }}

      - name: Prepare Qt 6.11.1 static kits (host x64 + target ARM64)
        shell: pwsh
        run: |
          # The ARM64 build cross-compiles from this x64 host, so qtbase needs a
          # host (x64) Qt install to run moc/rcc/uic during its own build. The
          # x64 job in this workflow already builds and caches this kit.
          $hostPrefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_64-static"
          $hostQtDir = Join-Path $hostPrefix "lib\cmake\Qt6"
          if (-not (Test-Path -LiteralPath (Join-Path $hostQtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "The x64 static Qt kit was not found at $hostQtDir. It should have been built and cached by the build-and-release job."
          }

          $targetPrefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_arm64-static"
          $targetQtDir = Join-Path $targetPrefix "lib\cmake\Qt6"
          if (-not (Test-Path -LiteralPath (Join-Path $targetQtDir "Qt6Config.cmake") -PathType Leaf)) {
            & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -QtVersion 6.11.1 -InstallPrefix $targetPrefix -ExternalHostBinDir (Join-Path $hostPrefix "bin")
            if ($LASTEXITCODE -ne 0) { throw "Static Qt ARM64 cross build failed." }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $targetQtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt 6.11.1 static ARM64 CMake package was not found at $targetQtDir"
          }
          "SNOW_QT_STATIC_DIR=$targetQtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$targetQtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Saved here, not in a post step, so that a later failure in this job
      # does not discard a Qt kit that took hours to cross-compile.
      - name: Save static Qt kit (ARM64)
        if: steps.qt-cache-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_arm64-static
          key: snow-qt-static-6.11.1-msvc2026-arm64-${{ runner.os }}

      - name: Install vcpkg and project dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Qt6Dir $env:SNOW_QT_STATIC_DIR -Arch arm64 -VcpkgVariants Static

      - name: Build, audit, and package statically (installer + portable)
        shell: pwsh
        run: .\scripts\stage-snow-shot-release.ps1 -Architecture arm64 -IncludePortable

      - name: Locate ARM64 packages
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem build\snow-shot-msvc-release-arm64 -File |
            Where-Object { $_.Name -match '^snow-shot-.+-windows-arm64\.(exe|exe\.sha256|zip|zip\.sha256)$' })
          if ($packages.Count -lt 4) { throw "The ARM64 installer, portable package, and checksums were not all produced." }
          $assets = ($packages | ForEach-Object { $_.FullName }) -join "`n"
          "assets<<SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-arm64
          path: ${{ steps.package.outputs.assets }}

      - name: Attach ARM64 assets to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "${{ steps.package.outputs.assets }}" -split "`n" | Where-Object { $_ }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
